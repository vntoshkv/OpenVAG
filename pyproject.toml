[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openvag-diagnostic"
version = "0.1.0.dev0"
description = "Read-only, simulated-first OBD-II diagnostic prototype"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.urls]
Repository = "https://github.com/vntoshkv/OpenVAG"
Issues = "https://github.com/vntoshkv/OpenVAG/issues"

[project.scripts]
openvag = "openvag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
